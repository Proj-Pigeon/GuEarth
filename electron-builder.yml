appId: io.github.hikaruqwq.guearth
productName: GuEarth
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - resources/**
  - '!node_modules/**'
asarUnpack:
  - out/renderer/cesium/**
extraResources:
  - from: resources/licenses
    to: licenses
  - from: THIRD-PARTY-NOTICES.md
    to: licenses/THIRD-PARTY-NOTICES.md
  - from: LICENSE
    to: licenses/LICENSE
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - arm64
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  executableName: GuEarth
  extraResources:
    - from: resources/bin/ffmpeg.exe
      to: bin/ffmpeg.exe
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  license: license.txt
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
