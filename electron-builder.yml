appId: io.github.hikaruqwq.guearth
productName: GuEarth
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - resources/**
  - '!resources/bin/**'
  - '!node_modules/**'
  - node_modules/koffi/**
  - '!node_modules/koffi/doc/**'
  - '!node_modules/koffi/lib/**'
  - '!node_modules/koffi/vendor/**'
  - '!node_modules/koffi/cnoke.cjs'
  - '!node_modules/koffi/src/**/*.cc'
  - '!node_modules/koffi/src/**/*.hh'
  - '!node_modules/koffi/src/**/*.asm'
  - '!node_modules/koffi/src/**/*.S'
  - '!node_modules/koffi/src/**/*.inc'
  - '!node_modules/koffi/src/**/*.def'
  - '!node_modules/koffi/src/**/CMakeLists.txt'
  - node_modules/@koromix/koffi-*/**
asarUnpack:
  - out/renderer/cesium/**
  - node_modules/@koromix/koffi-*/**/*.node
  - node_modules/koffi/build/**/*.node
extraResources:
  - from: resources/licenses
    to: licenses
  - from: THIRD-PARTY-NOTICES.md
    to: licenses/THIRD-PARTY-NOTICES.md
  - from: LICENSE
    to: licenses/LICENSE
mac:
  category: public.app-category.education
  target:
    - target: dmg
      arch:
        - arm64
  extraResources:
    - from: resources/bin/${arch}/libhawdb_ffi.dylib
      to: bin/libhawdb_ffi.dylib
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
win:
  executableName: GuEarth
  extraResources:
    - from: resources/bin/ffmpeg.exe
      to: bin/ffmpeg.exe
    - from: resources/bin/hawdb_ffi.dll
      to: bin/hawdb_ffi.dll
linux:
  executableName: guearth
  icon: icon.png
  category: Education
  syncDesktopName: true
  synopsis: 面向地理教学的三维数字地球
  description: 咕咕地球（GuEarth）是面向中国校园地理教学的三维数字地球，包含地形、专题图层与教学工具。
  maintainer: Project Pigeon <https://github.com/Proj-Pigeon/GuEarth>
  artifactName: ${name}-${version}-${arch}.${ext}
  desktop:
    entry:
      "Name[zh_CN]": 咕咕地球
      "Comment[zh_CN]": 面向地理教学的三维数字地球
      Keywords: geography;education;globe;地理;教学
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
  extraResources:
    - from: resources/bin/${arch}/ffmpeg
      to: bin/ffmpeg
    - from: resources/bin/${arch}/libhawdb_ffi.so
      to: bin/libhawdb_ffi.so
deb:
  packageCategory: education
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  license: license.txt
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
