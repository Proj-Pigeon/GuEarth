name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  windows:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect version bump
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.version.outputs.bumped == 'true'
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        if: steps.version.outputs.bumped == 'true'
        run: npm ci
      - name: Cache electron and electron-builder downloads
        if: steps.version.outputs.bumped == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: windows-electron-${{ hashFiles('package-lock.json') }}
      - name: Package Windows build
        if: steps.version.outputs.bumped == 'true'
        run: npm run build:win
      - name: Upload build artifact
        if: steps.version.outputs.bumped == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: guearth-${{ steps.version.outputs.version }}-win-x64
          path: dist/*.exe
          if-no-files-found: error
      - name: Create GitHub release
        if: steps.version.outputs.bumped == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_args=(--generate-notes)
          if [ -f "changelogs/v${{ steps.version.outputs.version }}.md" ]; then
            notes_args=(--notes-file "changelogs/v${{ steps.version.outputs.version }}.md")
          fi
          gh release create "v${{ steps.version.outputs.version }}" \
            --target "$GITHUB_SHA" \
            --title "GuEarth v${{ steps.version.outputs.version }}" \
            "${notes_args[@]}" \
            dist/*.exe
